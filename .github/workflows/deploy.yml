name: Build Kirmod

# Builds the obfuscated mod zip with MCP 7.2 through Korwith/MCPCommit (settings in omnimcp.json).
# Pushing a tag like v1.36 also publishes the zip as a GitHub release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.mcp.outputs.artifact-name }}
      version: ${{ steps.mcp.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: mcp
        uses: Korwith/MCPCommit@main
        with:
          config: omnimcp.json
          artifact-name: mod_Kirmod-${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/mod_Kirmod-${{ needs.build.outputs.version }}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kirmod ${{ needs.build.outputs.version }} for 1.3.2" \
            --generate-notes
