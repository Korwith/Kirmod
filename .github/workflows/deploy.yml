name: Build Kirmod

# builds the obfuscated mod zip with MCP 7.2 via MCPCommit
# this builds kirmod & kirmod lite

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.mcp.outputs.artifact-name }}
      version: ${{ steps.mcp.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: mcp
        uses: Korwith/MCPCommit@main
        with:
          config: omnimcp.json
          artifact-name: mod_Kirmod-${{ github.sha }}

  # lite variant
  build-lite:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.mcp.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Lay out Kirmod Lite
        run: ci/make-lite.sh build/lite

      - id: mcp
        uses: Korwith/MCPCommit@main
        with:
          config: build/lite/omnimcp.json
          artifact-name: mod_Kirmod-Lite-${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-lite]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-lite.outputs.artifact }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/mod_Kirmod-${{ needs.build.outputs.version }}.zip" \
            "dist/mod_Kirmod-Lite-${{ needs.build.outputs.version }}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kirmod ${{ needs.build.outputs.version }} for 1.3.2" \
            --generate-notes
